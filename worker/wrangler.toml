name = "m1-bus"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# The Worker serves the static board itself, so GitHub Pages and the API worker
# are no longer needed. The browser calls /api/* on the same origin.
[assets]
directory = "assets"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[vars]
ALLOWED_ORIGINS = "https://altcar.github.io,https://m1-bus.hheylau.workers.dev,http://127.0.0.1:3002,http://localhost:3002"
TAPI_DAILY_LIMIT = "28"
TAPI_CACHE_SECONDS = "21600"
TAPI_MIN_INTERVAL_SECONDS = "10"

[[kv_namespaces]]
binding = "BOARD_KV"
id = "be0912652ca549948b1194b01c40a20b"
